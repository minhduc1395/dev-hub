# Danh sách repo khách hàng mà đội coder phục vụ.
# Lịch điều phối chỉ đọc file này rồi hỏi GitHub các issue status:ready; không đọc gì khác khi không có việc.
# active: false = tạm dừng nhận job từ khách này.
# auto_merge: true = QA-PASS thì lịch QA tự merge (squash) và đóng issue; false = chờ Tech Lead merge.
clients:
  - name: sandbox
    repo: minhduc1395/dev-sandbox
    tech_lead: DIR (dự án thử)
    active: true
    auto_merge: true   # BOD 20/11: QA-PASS thì lịch QA tự merge, không chờ Tech Lead
  - name: vive-swipe
    repo: minhduc1395/vive-swipe
    tech_lead: WEB (VIVE)
    auto_merge: false  # WEB duyệt và merge
    active: true    # 20/11: nhận job khi WEB gắn status:ready; WEB duyệt và merge
